<!doctype html>

<head>
<meta charset="utf-8">

<title>PLACE by sisters – prezentace</title>
<style>
:root{--ink:#151313}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink)}
.frame,.build,.color,.final,.outro{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;visibility:hidden}
.outro{z-index:3}   /* závěr naskočí střihem přes poslední snímek */
.on{visibility:visible}
/* Kříž: vlastní vrstva, mimo hru přes display:none, aby nic neprosvítalo do ostatních screenů */
.reveal{position:fixed;inset:0;width:100%;height:100%;display:none}
.reveal.show{display:block}
/* Na Pragovce: mockupy fasády, klidné prolínání. Popisky v Nohemi, když leží ve fonts/, jinak systémové písmo */
@font-face{font-family:'Nohemi';src:url('fonts/Nohemi-Regular.woff2') format('woff2'),url('fonts/Nohemi-Regular.otf') format('opentype'),url('fonts/Nohemi-Regular.ttf') format('truetype');font-display:swap}
.mock{position:fixed;inset:0;background:#1E3B30;opacity:0;visibility:hidden;transition:opacity .5s ease,visibility 0s linear .5s}
.mock.on{opacity:1;visibility:visible;transition:opacity .5s ease;z-index:2}
/* předchozí snímek zůstane plně krytý pod novým, dokud se nový neprolne – jinak by mezi nimi prosvítalo logo */
.mock.under{opacity:1;visibility:visible;transition:none;z-index:1}
.mock img{display:block}
.mock .row{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:2.2vw}
.mock .row img{height:var(--h);width:auto}
.mock .cap{position:absolute;left:2.6vw;bottom:2.4vh;margin:0;font:400 max(12px,1vw)/1.3 'Nohemi',system-ui,'Segoe UI',sans-serif;color:rgba(255,255,255,.75);text-shadow:0 1px 6px rgba(0,0,0,.45)}
/* Barvy: paleta jako svislé pruhy, logo na každé barvě */
.stripes{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,1fr);overflow:hidden}
.stripe{position:relative;background:var(--c);color:var(--t)}
.stripe b,.stripe span{position:absolute;left:1.4vw;font-family:'Nohemi',system-ui,'Segoe UI',sans-serif;font-weight:400}
.stripe b{bottom:6vh;font-size:max(14px,1.5vw)}
.stripe span{bottom:3.4vh;font-size:max(11px,1vw);opacity:.75;letter-spacing:.04em}
.mock.on .stripe{animation:stripeIn .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.15s + var(--i) * 90ms)}
@keyframes stripeIn{from{transform:translateY(100%)}to{transform:none}}
.mock .note{position:absolute;top:3vh;left:1.4vw;margin:0;font:400 max(11px,.95vw)/1 'Nohemi',system-ui,'Segoe UI',sans-serif;color:rgba(255,255,255,.8);letter-spacing:.04em}
.tiles{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr)}
.tile{position:relative;background:var(--c);display:grid;place-items:center}
.tile svg{width:62%;height:auto;display:block}
.tile i{position:absolute;left:1.4vw;bottom:2.6vh;font:400 max(11px,.95vw)/1 'Nohemi',system-ui,'Segoe UI',sans-serif;font-style:normal;color:var(--t);opacity:.6}
.mock.on .tile{animation:fadeIn .6s ease both;animation-delay:calc(.1s + var(--i) * 80ms)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){.mock.on .stripe,.mock.on .tile{animation:none}}
/* Co symbol znamená: ztlumování částí symbolu a popisek (přechody jen v této kapitole, jinde by zdržovaly animace) */
#mcap{font:400 48px 'Nohemi',system-ui,'Segoe UI',sans-serif;fill:#fff;opacity:0;transition:opacity .35s ease;letter-spacing:.01em}
.meaning #arcs,.meaning #symX1,.meaning #symX2{transition:opacity .5s ease}
/* ovládací lišta */
.ctl{position:fixed;right:2vw;bottom:2.2vh;z-index:10;display:flex;align-items:center;gap:8px;padding:6px 6px 6px 16px;border-radius:999px;
  background:rgba(21,19,19,.55);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:opacity .4s ease}
.ctl.idle{opacity:0;pointer-events:none}
.ctl .step{font:400 14px/1 'Nohemi',system-ui,'Segoe UI',sans-serif;color:rgba(255,255,255,.8);margin-right:6px;white-space:nowrap}
.ctl button{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.ctl button:hover{background:rgba(255,255,255,.14)}
.ctl button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.ctl button:disabled{opacity:.3;cursor:default;background:transparent}
.ctl svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>

// ms na jeden screen; při omezeném pohybu pomaleji
const STEP = reduced ? 800 : 300;
// dopředu / zpět; PageDown a PageUp posílá většina prezentačních ovladačů
const FWD_KEYS = [' ', 'ArrowRight', 'ArrowDown', 'PageDown'];
const BACK_KEYS = ['ArrowLeft', 'ArrowUp', 'PageUp'];
let timer = null, i = 0, mode = 'intro';

function show(el){ all.forEach(f => f.classList.toggle('on', f === el)); }
function stop(){ clearTimeout(timer); timer = null; }
function play(){
  stop(); resetReveal(); hideMocks(); mode = 'intro';
  (function tick(){
    show(frames[i]);
    i = (i + 1) % frames.length;
    timer = setTimeout(tick, STEP);
  })();
}
function assemble(){
  stop(); mode = 'word';
  let k = 0;
  (function tick(){
    show(build[k]);
    if (++k < build.length) timer = setTimeout(tick, STEP);
    else timer = setTimeout(() => cycle(1), STEP);
  })();
}
function cycle(c){
  mode = 'colors';
  (function tick(){
    show(colors[c]);
    c = (c + 1) % colors.length;
    timer = setTimeout(tick, STEP);
  })();
}

/* ---------- kříž ---------- */
const reveal = $('reveal');
const C = [109.65, 702.985];          // střed kříže v P (nožička × příčka), jednotky masteru
const K = 432 / 183.32;               // měřítko P na posledním záběru
const T = (k, c) => `translate(960 540) scale(${k}) translate(${-c[0]} ${-c[1]})`;
const clamp = x => Math.max(0, Math.min(1, x)), lerp = (a, b, v) => a + (b - a) * v;
const io = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
$('pl').innerHTML = [LOGO.place.P, LOGO.place.Pbar].map(d => `<path d="${d}"/>`).join('');

// kříž jako polygon: v = 0 přesný tvar z P (nožička 69.46 nad / 70.4 pod příčkou, příčka 63.37, ramena 109.65 j.),
// v = 1 proporce X z masteru (tah 71.14, poloviční délka 94.06); body si odpovídají, takže tvar plynule přejde
const XP = [[74.92, 593.335], [144.38, 593.335], [144.38, 671.3], [219.3, 671.3], [219.3, 734.67], [145.32, 734.67],
            [145.32, 812.635], [74.92, 812.635], [74.92, 734.67], [0, 734.67], [0, 671.3], [74.92, 671.3]];
const XM = [[-1, -2], [1, -2], [1, -1], [2, -1], [2, 1], [1, 1], [1, 2], [-1, 2], [-1, 1], [-2, 1], [-2, -1], [-1, -1]]
  .map(([x, y]) => [C[0] + Math.sign(x) * (Math.abs(x) === 1 ? 35.57 : 94.06), C[1] + Math.sign(y) * (Math.abs(y) === 1 ? 35.57 : 94.06)]);
function setX(v, rot){
  set('xpoly', 'points', XP.map((p, j) => `${lerp(p[0], XM[j][0], v)},${lerp(p[1], XM[j][1], v)}`).join(' '));
  set('xpoly', 'transform', rot ? `rotate(45 ${C[0]} ${C[1]})` : '');
}

// symbol z masteru: oblouky (dokreslují se) + levé X + pravé X (přijede)
const lineD = l => `M${l[0]},${l[1]}L${l[2]},${l[3]}`;
$('sym').innerHTML =
  '<g id="symCore">' +
  // oblouky ve společné skupině: ztlumené se v místě překryvu nesčítají (jinak tam prosvítala světlejší čočka)
  '<g id="arcs">' + LOGO.arcs.map((d, k) => `<path id="arc${k + 1}" d="${d}" visibility="hidden"/>`).join('') + '</g>' +
  LOGO.xs.map((x, k) => `<g id="symX${k + 1}">` + x.map(l => `<path d="${lineD(l)}"/>`).join('') + '</g>').join('') + '</g>' +
  // celé logo: PLACE po písmenech (wl0–wl4) v poloze masteru a „by sisters“ (wby)
  '<g fill="#FFFFFF" stroke="none">' +
  ['P', 'L', 'A', 'C', 'E'].map((k, j) => `<g id="wl${j}">` + (k === 'P' ? [LOGO.place.P, LOGO.place.Pbar] : [LOGO.place[k]]).map(d => `<path d="${d}"/>`).join('') + '</g>').join('') +
  '<g id="wby">' + LOGO.by.map(d => `<path d="${d}"/>`).join('') + '</g></g>';
const arc1 = $('arc1'), arc2 = $('arc2');
// dokreslení oblouku: a = 0 nic, a = 1 celý. Čárkování ve skutečné délce cesty a mimo kreslení úplně vypnuté:
// s pathLength="1" nechával Chrome na konci skrytého oblouku tenkou pixelovou čárku
function drawArc(el, a){
  if (a <= 0){ el.setAttribute('visibility', 'hidden'); return; }
  el.setAttribute('visibility', 'visible');
  if (a >= 1){ el.style.strokeDasharray = 'none'; el.style.strokeDashoffset = 0; return; }
  const L = el._len || (el._len = el.getTotalLength());
  el.style.strokeDasharray = `${L} ${2 * L}`;
  el.style.strokeDashoffset = -(1 - a) * L;          // viditelný úsek [1 − a, 1] délky cesty, kreslí se jako dřív
}
// celé logo na šířku (varianta D z logo_pomery.html): symbol vlevo opticky 1,2× výška písmen, oblouky na účaří,
// mezera 2 moduly (tah 71.14 j.), tloušťka tahu jako u písmen; „by sisters“ na 68 % = přesně široké jako „CE“,
// 1 modul pod účařím, zarovnané doprava pod E
const CS = 1.05311, CT = [-1729.012, 450.146];
const CBS = .68313, CBY = [952.434, 280.466];
const KL = 1152 / 3209.75, LC = [390.795, 761.834];  // celé logo (3209.75 × 620.71 j.) na 60 % šířky, na středu
function setCore(v){                                // v = 0 symbol jako v masteru, v = 1 na místě v logu na šířku
  const s = lerp(1, CS, v);
  set('symCore', 'transform', `translate(${lerp(0, CT[0], v)} ${lerp(0, CT[1], v)}) scale(${s})`);
  set('symCore', 'stroke-width', 71.14 / s);
}
function wordState(p, b){
  for (let j = 0; j < 5; j++){ set('wl' + j, 'opacity', p); set('wl' + j, 'transform', ''); }
  set('wby', 'opacity', b); set('wby', 'transform', `translate(${CBY[0]} ${CBY[1]}) scale(${CBS})`);
}
// klidové stavy pro návrat šipkou zpět
function symbolState(){
  stop(); animGen++; mode = 'symbol';
  set('pg', 'opacity', 0); set('sym', 'opacity', 1); set('sym', 'transform', T(KS, SC)); set('symX2', 'opacity', 1); set('bgInt', 'opacity', 0);
  drawArc(arc1, 1); drawArc(arc2, 1); wordState(0, 0); setCore(0); clearMeaning();
}
/* ---------- Co symbol znamená: 5 čtení, svítí jen dotčená část symbolu, zbytek se ztlumí ---------- */
const MEANING = [
  { t: 'označení místa – x marks the spot', a: .22, x1: 1,   x2: .22 },   // jen levé X
  { t: 'dvě ségry',                         a: 1,   x1: .22, x2: .22 },   // oblouky
  { t: 'sesterské spojení',                 a: 1,   x1: .22, x2: .22, redraw: true },   // oblouky se dokreslí jednou linkou
  { t: 'kozy',                              a: 1,   x1: 1,   x2: 1 },     // celý symbol
  { t: 'pásky',                             a: .22, x1: 1,   x2: 1 },     // obě X
];
let mIdx = -1;
const mcap = $('mcap');
function clearMeaning(){
  mIdx = -1; $('sym').classList.remove('meaning');
  [$('arcs'), $('symX1'), $('symX2')].forEach(el => { el.style.opacity = ''; });
  mcap.style.opacity = 0; mcap.textContent = '';
}
function meaning(n){
  stop(); animGen++; mode = 'meaning'; mIdx = n;
  const s = MEANING[n]; $('sym').classList.add('meaning');
  $('arcs').style.opacity = s.a; $('symX1').style.opacity = s.x1; $('symX2').style.opacity = s.x2;
  drawArc(arc1, 1); drawArc(arc2, 1);
  const swap = () => { mcap.textContent = s.t; mcap.style.opacity = 1; };
  if (mcap.textContent){ mcap.style.opacity = 0; timer = setTimeout(swap, 300); } else swap();   // popisek se prolne
  if (s.redraw && !reduced) anim(1300, t => {               // linka se jednou dokreslí zleva doprava
    const a1 = clamp(t / .5), a2 = clamp((t - .5) / .5);
    drawArc(arc1, a1 * a1);
    drawArc(arc2, 1 - (1 - a2) * (1 - a2));
  });
}
function logoState(withBy){
  symbolState(); mode = withBy ? 'logo-full' : 'logo';
  set('sym', 'transform', T(KL, LC)); setCore(1); wordState(1, withBy ? 1 : 0);
}
const XC = [760.26, 91.66];                          // střed levého X v masteru
const KS = 960 / 1021.33, SC = [997.84, 190.57];     // symbol (1021.33 j. vč. tahu) na 50 % šířky, na středu
const SEND = [960 + KS * (XC[0] - SC[0]), 540 + KS * (XC[1] - SC[1])];
let animGen = 0;                                     // zvýšení zruší běžící animaci
function anim(ms, step, done){
  const t0 = performance.now(), gen = ++animGen;
  (function f(now){
    if (gen !== animGen) return;
    const t = ms <= 1 ? 1 : Math.min(1, (now - t0) / ms);
    step(t);
    if (t < 1) requestAnimationFrame(f); else if (done) done();
  })(t0);
}

// záběry po 0,3 s: c = bod P (jednotky masteru) na středu obrazovky, k = měřítko
const SHOTS = [
  { c: [330, 560], k: 7 },                     // teasing: oblouk bříška zblízka
  { c: [110, 800], k: 6 },                     // teasing: pata nožičky
  { c: [20, 703], k: 6 },                      // teasing: konec příčky (náznak kříže)
  { c: [230, 650], k: 5 },                     // teasing: výřez bříška
  { c: [240, 640], k: 1.5 },                   // P mimo střed
  { c: C, k: K * .5 },                         // celé P
  { c: C, k: K },                              // bližší P
  { c: C, k: K, plus: true },                  // „+“ = přesný tvar z P
  { c: C, k: K, plus: true, x: true },         // tentýž kříž otočený o 45°, bílý
];
function crossFrame(f){
  const s = SHOTS[f];
  set('pg', 'transform', T(s.k, s.c)); set('pg', 'opacity', 1); set('bgInt', 'opacity', 1);
  set('pl', 'opacity', s.plus ? 0 : 1);
  set('xpoly', 'opacity', s.plus ? 1 : 0);
  setX(0, s.x);
  set('sym', 'opacity', 0); set('symX2', 'opacity', 0);
  drawArc(arc1, 0); drawArc(arc2, 0);
  wordState(0, 0); setCore(0); clearMeaning();
}
function resetReveal(){ animGen++; reveal.classList.remove('show'); crossFrame(0); }
function toCross(){ stop(); animGen++; crossFrame(SHOTS.length - 1); mode = 'cross'; }
// krok 1: kříž doladí proporce na X z masteru → kamera odjede, přijede druhé X, oblouky se dokreslí jednou linkou
function startSymbol(){
  stop(); mode = 'symbol-anim';
  anim(reduced ? 1 : 700, t => { setX(io(t), true); set('bgInt', 'opacity', 1 - io(t)); }, () => {   // interiér → Lahvová, kříž → X
    set('bgInt', 'opacity', 0);
    set('pg', 'opacity', 0); set('sym', 'opacity', 1);
    anim(reduced ? 1 : 2200, t => {
      const v = io(t), z = Math.exp(lerp(Math.log(K), Math.log(KS), v));
      const S = [lerp(960, SEND[0], v), lerp(540, SEND[1], v)];
      set('sym', 'transform', T(z, [XC[0] - (S[0] - 960) / z, XC[1] - (S[1] - 540) / z]));
      set('symX2', 'opacity', clamp((t - .05) / .3));
      const a1 = clamp((t - .25) / .38), a2 = clamp((t - .63) / .37);
      drawArc(arc1, a1 * a1);                    // levý oblouk zrychluje…
      drawArc(arc2, 1 - (1 - a2) * (1 - a2));    // …pravý plynule navazuje a dobrzdí
    }, () => { mode = 'symbol'; });
  });
}
// krok 3: symbol plynule odjede doleva na své místo v logu na šířku, vpravo se po písmenech objeví PLACE
function startLogo(){
  symbolState(); mode = 'logo-anim';
  anim(reduced ? 1 : 1700, t => {
    const v = io(clamp(t / .75)), z = Math.exp(lerp(Math.log(KS), Math.log(KL), v));
    set('sym', 'transform', T(z, [lerp(SC[0], LC[0], v), lerp(SC[1], LC[1], v)]));
    setCore(v);
    for (let j = 0; j < 5; j++){
      const u = io(clamp((t - .4 - j * .07) / .3));
      set('wl' + j, 'opacity', u); set('wl' + j, 'transform', `translate(0 ${(1 - u) * 60})`);
    }
  }, () => { mode = 'logo'; });
}
// krok 3b: pod E se dopíše „by sisters“
function startBy(){
  stop(); mode = 'by-anim';
  anim(reduced ? 1 : 900, t => {
    const u = io(t);
    set('wby', 'opacity', u); set('wby', 'transform', `translate(${CBY[0]} ${CBY[1] + (1 - u) * 40}) scale(${CBS})`);
  }, () => { mode = 'logo-full'; });
}
function toFinal(){ stop(); resetReveal(); show(final); mode = 'final'; }
function startReveal(){
  stop(); mode = 'zoom';
  show(null); reveal.classList.add('show');
  let f = 0;
  (function tick(){
    crossFrame(f);
    if (++f < SHOTS.length) timer = setTimeout(tick, STEP); else mode = 'cross';
  })();
}

// první screen hned, smyčka až po načtení všech obrázků, aby střih necukal
show(frames[0]);
Promise.all([...document.images].map(im => im.decode().catch(() => {}))).then(play);

/* ---------- Na Pragovce: mockupy fasády ---------- */
const mocks = [...document.querySelectorAll('.mock')];
let mi = -1;
// Barvy: logo na šířku (varianta D) na každé barvě palety, v kontrastní barvě (geometrie z masteru, rozmístění jako v kroku Logo)
function lockupD(col){
  return '<svg viewBox="-1214.08 451.48 3209.75 620.71" role="img" aria-label="Logo PLACE by sisters">' +
    `<g transform="translate(${CT[0]} ${CT[1]}) scale(${CS})" fill="none" stroke="${col}" stroke-width="${71.14 / CS}" stroke-linejoin="round">` +
    LOGO.arcs.map(d => `<path d="${d}"/>`).join('') + LOGO.xs.flat().map(l => `<path d="${lineD(l)}"/>`).join('') + '</g>' +
    `<g fill="${col}">` + ['P', 'Pbar', 'L', 'A', 'C', 'E'].map(k => `<path d="${LOGO.place[k]}"/>`).join('') + '</g>' +
    `<g fill="${col}" transform="translate(${CBY[0]} ${CBY[1]}) scale(${CBS})">` + LOGO.by.map(d => `<path d="${d}"/>`).join('') + '</g></svg>';
}
$('tiles').innerHTML =[['Oxblood', '#5B1E26', '#FFFFFF'], ['Lahvová zelená', '#1E3B30', '#FFFFFF'], ['Pudrová', '#D9A3AB', '#151313'],
                        ['Krém', '#F1EADF', '#151313'], ['Inkoust', '#151313', '#F1EADF'], ['Bílá', '#FFFFFF', '#151313']]
  .map(([n, c, t], j) => `<div class="tile" style="--c:${c};--t:${t};--i:${j}">${lockupD(t)}<i>${n}</i></div>`).join('');
let underT = null;
function hideMocks(){ clearTimeout(underT); mocks.forEach(m => m.classList.remove('on', 'under')); mi = -1; }
function showMock(n){
  stop(); clearTimeout(underT);
  const prevSlide = mi >= 0 ? mocks[mi] : null;
  mocks.forEach(m => m.classList.remove('under'));
  if (prevSlide && prevSlide !== mocks[n]){ prevSlide.classList.remove('on'); prevSlide.classList.add('under'); }
  mi = n; mocks[n].classList.add('on'); mode = 'mock';
  underT = setTimeout(() => mocks.forEach(m => m.classList.remove('under')), 600);   // po prolnutí starý snímek schovat
}

function next(){
  if (mode === 'intro') assemble();
  else if (mode === 'colors') toFinal();
  else if (mode === 'final') startReveal();
  else if (mode === 'cross') startSymbol();
  else if (mode === 'symbol') meaning(0);
  else if (mode === 'meaning'){ if (mIdx < MEANING.length - 1) meaning(mIdx + 1); else startLogo(); }
  else if (mode === 'logo') startBy();
  else if (mode === 'logo-full') showMock(0);
  else if (mode === 'mock'){ if (mi < mocks.length - 1) showMock(mi + 1); else playOutro(); }
}
// závěr: symbol ve stejném rychlém střihu jako úvod, ve smyčce až do konce
function playOutro(){
  stop(); hideMocks(); mode = 'outro';
  let k = 0;
  (function tick(){
    show(outro[k]);
    k = (k + 1) % outro.length;
    timer = setTimeout(tick, STEP);
  })();
}
function prev(){
  if (mode === 'word' || mode === 'colors'){ i = 0; play(); }  // → úvod
  else if (mode === 'final'){ stop(); cycle(0); }               // → barevná smyčka PLACE
  else if (mode === 'zoom' || mode === 'cross') toFinal();     // → PLACE na interiéru
  else if (mode === 'symbol-anim' || mode === 'symbol') toCross(); // → kříž
  else if (mode === 'meaning'){ if (mIdx > 0) meaning(mIdx - 1); else symbolState(); }   // → předchozí čtení / symbol
  else if (mode === 'logo-anim' || mode === 'logo'){ symbolState(); meaning(MEANING.length - 1); } // → poslední čtení symbolu
  else if (mode === 'by-anim' || mode === 'logo-full') logoState(false); // → logo bez by sisters
  else if (mode === 'mock'){ if (mi > 0) showMock(mi - 1); else { hideMocks(); logoState(true); } }   // → předchozí mockup / celé logo
  else if (mode === 'outro'){ stop(); show(null); showMock(mocks.length - 1); }                         // → poslední snímek (logo na barvách)
}
function restart(){ i = 0; play(); }
function fullscreen(){
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
}

addEventListener('keydown', e => {
  if (FWD_KEYS.includes(e.key)){ e.preventDefault(); next(); }
  if (BACK_KEYS.includes(e.key)){ e.preventDefault(); prev(); }
  if (e.key === 'r' || e.key === 'R') restart();
  if (e.key === 'f' || e.key === 'F') fullscreen();
});

/* ---------- ovládací lišta: tlačítka + název části, schová se, když se myš nehýbe ---------- */
const ctl = $('ctl'), stepName = $('stepName'), bPrev = $('bPrev'), bNext = $('bNext');
[['bPrev', prev], ['bNext', next], ['bRestart', restart], ['bFs', fullscreen]].forEach(([id, fn]) =>
  $(id).addEventListener('click', e => { fn(); e.currentTarget.blur(); }));   // blur: mezerník pak neklikne znovu
const NAMES = { intro: 'Úvod', word: 'PLACE', colors: 'PLACE', final: 'PLACE na interiéru', zoom: 'Kříž', cross: 'Kříž', meaning: 'Co symbol znamená',
                'symbol-anim': 'Symbol', symbol: 'Symbol', 'logo-anim': 'Logo', logo: 'Logo', 'by-anim': 'Logo', 'logo-full': 'Logo', outro: 'Závěr' };
setInterval(() => {
  stepName.textContent = mode === 'mock' ? mocks[mi].dataset.name : (NAMES[mode] || '');
  bPrev.disabled = mode === 'intro';
  bNext.disabled = mode === 'outro';
}, 150);
let idleT = null;
function wake(){ ctl.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => { if (!ctl.matches(':hover, :focus-within')) ctl.classList.add('idle'); }, 2500); }
['mousemove', 'pointerdown', 'touchstart', 'keydown'].forEach(ev => addEventListener(ev, wake, { passive: true }));
wake();
</script>
</body>
</html>
